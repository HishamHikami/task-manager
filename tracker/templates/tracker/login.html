{% extends "tracker/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow login">
  {% load static %}<div class="brand"><img src="{% static 'tracker/icons/icon.svg' %}" alt="" width="32" height="32"> Task Manager</div>
  <form method="post" hx-boost="false">
    {% csrf_token %}
    {% include "tracker/partials/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
