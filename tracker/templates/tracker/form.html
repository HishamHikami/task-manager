{% extends "tracker/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {% include "tracker/partials/form_fields.html" %}
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
