{% extends "tracker/base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete “{{ object }}”?</h1>
  <p>This removes the task and its whole timeline. It can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="btn btn-danger" type="submit">Delete</button>
      <a class="btn" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
