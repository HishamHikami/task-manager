<a class="row event{% if event.is_off %} is-off{% endif %}" href="{{ event.get_absolute_url }}">
  <div class="datebox"><span class="d">{{ event.start|date:"j" }}</span><span class="m">{{ event.start|date:"M" }}</span></div>
  <div class="row-main">
    <span class="row-title">{{ event.title }}</span>
    <span class="row-meta">
      {% if not hide_ws %}<span class="dot c-{{ event.workspace.color }}" title="{{ event.workspace.name }}"></span>{% endif %}
      <span>{{ event.start|date:"D, H:i" }}</span>
      <span class="sep">{{ event.get_my_role_display }}</span>
      {% if event.location %}<span class="sep">{{ event.location }}</span>{% elif event.online_link %}<span class="sep">Online</span>{% endif %}
    </span>
  </div>
  <div class="row-side"><span class="pill status-{{ event.status }}">{{ event.status_short }}</span></div>
</a>
