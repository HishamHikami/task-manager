{% comment %}Phone and email of `p` (a department/person or a contact) with tap-to-call/email links and one-click copy buttons.{% endcomment %}{% if p.phone or p.email %}<span class="contactlinks">{% if p.phone %}<span class="cl-item"><a href="tel:{{ p.phone_link }}">📞 {{ p.phone }}</a><button type="button" class="copybtn" data-copy="{{ p.phone }}" title="Copy phone number" aria-label="Copy phone number {{ p.phone }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></span>{% endif %}{% if p.email %}<span class="cl-item"><a href="mailto:{{ p.email }}">✉ {{ p.email }}</a><button type="button" class="copybtn" data-copy="{{ p.email }}" title="Copy email address" aria-label="Copy email address {{ p.email }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></span>{% endif %}</span>{% endif %}
